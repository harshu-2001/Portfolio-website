    <text x="78.0" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">AI Foundry</text>
    <rect x="132.0" y="150" width="97.2" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#f093fb" stroke-opacity="0.30" stroke-width="1"/>
