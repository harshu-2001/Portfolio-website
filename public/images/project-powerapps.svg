<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <radialGradient id="g5-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g5-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <pattern id="g5-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="g5-clip">
      <rect width="600" height="360" rx="20"/>
    </clipPath>
    <linearGradient id="g5-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131d33"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="20" fill="#070c18"/>

  <g clip-path="url(#g5-clip)">
    <rect width="600" height="360" fill="url(g5-dots)"/>
    <circle cx="520" cy="60" r="170" fill="url(#g5-glow)"/>
    <circle cx="520" cy="60" r="170" fill="none" stroke="#4facfe" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M0 360 L600 360 L600 300 Q300 250 0 300 Z" fill="#4facfe" opacity="0.035"/>
  </g>

  <!-- icon chip -->
  <rect x="36" y="34" width="64" height="64" rx="16" fill="url(#g5-chip)" stroke="#4facfe" stroke-opacity="0.35" stroke-width="1"/>
  <g transform="translate(52,50)">

    <g fill="none" stroke="url(#g5-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="10" height="10" rx="2.4"/>
      <rect x="18" y="4" width="10" height="10" rx="2.4"/>
      <rect x="4" y="18" width="10" height="10" rx="2.4"/>
      <path d="M23 18v10M18 23h10"/>
    </g>

  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="118" y="63" font-size="21" font-weight="700" fill="#f2f6fc">Power Apps Case Management</text>
    <text x="118" y="86" font-size="12.5" fill="#8fa3c4">Power Apps · Dataverse · Power Automate</text>
  </g>

  <line x1="36" y1="120" x2="564" y2="120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">
    <rect x="36.0" y="150" width="84.0" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#4facfe" stroke-opacity="0.30" stroke-width="1"/>
    <text x="78.0" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Power Apps</text>
    <rect x="132.0" y="150" width="77.4" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#4facfe" stroke-opacity="0.30" stroke-width="1"/>
    <text x="170.7" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Dataverse</text>
    <rect x="221.4" y="150" width="110.4" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#4facfe" stroke-opacity="0.30" stroke-width="1"/>
    <text x="276.6" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Power Automate</text>
