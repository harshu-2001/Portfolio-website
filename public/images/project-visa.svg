<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="g3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g3-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <pattern id="g3-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="g3-clip">
      <rect width="600" height="360" rx="20"/>
    </clipPath>
    <linearGradient id="g3-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131d33"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="20" fill="#070c18"/>

  <g clip-path="url(#g3-clip)">
    <rect width="600" height="360" fill="url(g3-dots)"/>
    <circle cx="520" cy="60" r="170" fill="url(#g3-glow)"/>
    <circle cx="520" cy="60" r="170" fill="none" stroke="#667eea" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M0 360 L600 360 L600 300 Q300 250 0 300 Z" fill="#667eea" opacity="0.035"/>
  </g>

  <!-- icon chip -->
  <rect x="36" y="34" width="64" height="64" rx="16" fill="url(#g3-chip)" stroke="#667eea" stroke-opacity="0.35" stroke-width="1"/>
  <g transform="translate(52,50)">

    <g fill="none" stroke="url(#g3-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="17" height="24" rx="2.5"/>
      <path d="M9 11h9M9 15h9M9 19h5"/>
      <circle cx="23" cy="23" r="6.2"/>
      <path d="M20.4 23l1.8 1.8 3.4-3.6"/>
    </g>

  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="118" y="63" font-size="21" font-weight="700" fill="#f2f6fc">Visa Application Assistant</text>
    <text x="118" y="86" font-size="12.5" fill="#8fa3c4">Copilot Studio · Power Platform · Dataverse</text>
  </g>

  <line x1="36" y1="120" x2="564" y2="120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">
    <rect x="36.0" y="150" width="110.4" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#667eea" stroke-opacity="0.30" stroke-width="1"/>
    <text x="91.2" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Copilot Studio</text>
    <rect x="158.4" y="150" width="110.4" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#667eea" stroke-opacity="0.30" stroke-width="1"/>
    <text x="213.6" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Power Platform</text>
    <rect x="280.8" y="150" width="77.4" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#667eea" stroke-opacity="0.30" stroke-width="1"/>
    <text x="319.5" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Dataverse</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
