    <text x="84.6" y="168" font-size="11.5" fill="#cfe0fb" text-anchor="middle">Azure OpenAI</text>
    <rect x="145.2" y="150" width="77.4" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.045" stroke="#667eea" stroke-opacity="0.30" stroke-width="1"/>
